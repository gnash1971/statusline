[package]
name = "statusline"
version = "2.2.0"
edition = "2021"
publish = false
description = "Ligne de statut Claude Code — portage natif de statusline.ps1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gnash1971/statusline"

[[bin]]
name = "statusline"
path = "src/main.rs"

[dependencies]
# Lecture du payload uniquement. La dérive « derive » de serde n'est pas
# activée : tout passe par serde_json::Value, ce qui évite de compiler une
# macro procédurale et garde le temps de compilation sous la dizaine de
# secondes. L'écriture du cache est faite à la main, son format devant être
# reproduit octet pour octet (voir ecrire_cache).
serde_json = { version = "1.0", default-features = false, features = ["std"] }

# Deux besoins, tous deux absents de la bibliothèque standard : les
# métadonnées de version d'un exécutable, et la conversion vers l'heure
# locale du poste.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Time",
    "Win32_System_SystemInformation",
    "Win32_System_Console",
    # CreateFileW, par lequel la sonde de largeur ouvre CONOUT$, est déclaré sous
    # cette feature à cause de son argument SECURITY_ATTRIBUTES.
    "Win32_Security",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Déroulement explicite, et non « abort ». Toute la philosophie du script
# d'origine tient dans son filet de dernier recours : une sortie vide efface la
# ligne de statut. Avec « panic = abort », catch_unwind serait inopérant et un
# panic ne produirait aucune sortie du tout.
panic = "unwind"
