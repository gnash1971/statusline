# CI de la ligne de statut.
#
# Déclencheurs : push sur main, pull request vers main, déclenchement manuel.
# Le dépôt est public : les runners standard y sont gratuits, y compris
# Windows. (La restriction héritée de dsn-analyzer — dépôt privé, minutes
# Windows facturées ×2, un filtre `branches: '**'` avait épuisé le crédit du
# mois — n'a pas d'objet ici.) Les pull requests de Dependabot passent donc
# par les trois jobs avant fusion.
#
# Trois jobs, tous bloquants : tests, build + format, clippy sous `-D warnings`
# sur toutes les cibles (tests compris). Clippy a été non bloquant le temps du
# premier push, jusqu'à la correction des trois lints qu'il relevait — le
# 20/09/2026, le jour même.
#
# Sécurité de la chaîne (20/09/2026) : le jeton du workflow est en lecture
# seule (`permissions`, en plus du défaut du dépôt) ; chaque action est
# épinglée par le SHA complet de son commit, la version en commentaire — le
# dépôt exige cet épinglage (`sha_pinning_required`) et n'autorise que les
# actions GitHub, `dtolnay/rust-toolchain` et `Swatinem/rust-cache`. Dependabot
# (`.github/dependabot.yml`) signale par pull request les nouvelles versions
# de checkout et de rust-cache ; rust-toolchain n'a ni tag ni release, son
# épingle se met à jour à la main. Épinglé par SHA, rust-toolchain exige
# l'entrée `toolchain`.
#
# Une PR Dependabot ne se fusionne pas ici : ce fichier a sa source dans le
# workspace qui alimente le dépôt, et un déploiement défait ce que le dépôt
# seul aurait changé (le script s'y refuse, code 2). La mise à jour s'applique
# à la source, se déploie, et la PR se ferme d'elle-même.
#
# actions/checkout en v5 : la v4 déclare Node 20, que les runners exécutent de
# force sur Node 24 depuis septembre 2025 avec un avertissement à chaque job ;
# la v5 déclare node24 sans autre changement. rust-cache@v2 le déclare déjà.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un push qui en suit un autre sur la même référence annule le run dépassé.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: statusline-rs

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 20/09/2026
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: statusline-rs
          shared-key: ci
      - run: cargo test --locked --all-targets

  build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 20/09/2026
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: statusline-rs
          shared-key: ci
          save-if: false
      - run: cargo build --locked --release
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 20/09/2026
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: statusline-rs
          shared-key: ci
          save-if: false
      - run: cargo clippy --locked --all-targets -- -D warnings
